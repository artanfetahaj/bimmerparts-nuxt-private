customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - key: X-Frame-Options
        value: DENY
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      # CSP for statically-served / prerendered pages (no Nitro handler → no nonce available).
      # Uses an allowlist approach; inline scripts must be avoided on these pages.
      # Dynamic SSR routes get a nonce-based CSP from nuxt-security instead.
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'strict-dynamic' https://challenges.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://challenges.cloudflare.com https://*.google-analytics.com https://*.googletagmanager.com; img-src 'self' data: https://bimmerparts-public.s3.eu-central-1.amazonaws.com https://besa-crm.s3.eu-central-1.amazonaws.com https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://challenges.cloudflare.com https://www.googletagmanager.com; form-action 'self' https://www.mollie.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

redirects:
  - source: http://<*>
    target: https://<*>
    status: '301'
    condition: null
