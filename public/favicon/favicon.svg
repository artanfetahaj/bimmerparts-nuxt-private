<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- White background with rounded corners -->
  <rect width="512" height="512" rx="80" fill="#ffffff"/>

  <!-- B - black -->
  <text x="52" y="320" font-family="Arial Black, Arial" font-weight="900" font-size="280" fill="#1a1a1a">B</text>

  <!-- P - gold -->
  <text x="248" y="320" font-family="Arial Black, Arial" font-weight="900" font-size="280" fill="#c9a84c">P</text>

  <!-- Three diagonal stripes -->
  <g transform="translate(110, 345)">
    <polygon points="0,55 38,0 68,0 30,55" fill="#e8472a"/>
    <polygon points="48,55 86,0 116,0 78,55" fill="#3d4349"/>
    <polygon points="96,55 134,0 164,0 126,55" fill="#4a8fc1"/>
  </g>
</svg>
